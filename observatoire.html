document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\" style=\"position: absolute; inset: 0;\"><polygon points=\"12,3 34,3 45,23 34,43 12,43 1,23\" fill=\"none\" stroke=\"#dd203c\" stroke-width=\"1\"><\u002Fpolygon><polygon points=\"16,10 30,10 37,23 30,36 16,36 9,23\" fill=\"rgba(221,32,60,.14)\" stroke=\"#dd203c\" stroke-width=\".6\" stroke-dasharray=\"2 3\"><\u002Fpolygon><\u002Fsvg><span style=\"position: relative; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #f3f1ec;\">03<\u002Fspan><\u002Fspan>\n        <span aria-hidden=\"true\" style=\"width: 56px; height: 1px; background: #dd203c;\"><\u002Fspan>\n        <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: #a3a09a;\">03 / 04 · Voir<\u002Fspan>\n      <\u002Fdiv>\n      <h2 style=\"margin: 0; font-family: 'GC Sanomat', Georgia, serif; font-weight: 400; font-size: clamp(32px, 3.4vw, 48px); line-height: 1;\">Les images<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display: flex; align-items: center; gap: 10px;\">\n      <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #a3a09a; margin-right: 8px;\">{{mediaCount}}<\u002Fspan>\n      <button sc-camel-on-click=\"{{carPrev}}\" aria-label=\"Images précédentes\" style=\"width: 44px; height: 44px; border: 1px solid #333336; border-radius: 50%; background: none; color: #f3f1ec; display: grid; place-items: center;\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 14 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" aria-hidden=\"true\"><path d=\"M9 2 4 7l5 5\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n      <button sc-camel-on-click=\"{{carNext}}\" aria-label=\"Images suivantes\" style=\"width: 44px; height: 44px; border: 1px solid #dd203c; border-radius: 50%; background: none; color: #f3f1ec; display: grid; place-items: center;\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 14 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" aria-hidden=\"true\"><path d ground: #dd203c;\"><\u002Fspan>\n        <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: #a3a09a;\">04 / 04 · Quoi<\u002Fspan>\n      <\u002Fdiv>\n      <h2 style=\"margin: 0; font-family: 'GC Sanomat', Georgia, serif; font-weight: 400; font-size: clamp(32px, 3.4vw, 48px); line-height: 1;\">Le journal<\u002Fh2>\n    <\u002Fdiv>\n    <sc-if value=\"{{anyFilter}}\" hint-placeholder-val=\"{{false}}\"><button sc-camel-on-click=\"{{reset}}\" style=\"border: 1px solid #dd203c; background: none; padding: 9px 14px; color: #dd203c; font-size: 11px; letter-spacing: .16em; text-transform: uppercase;\">Réinitialiser les filtres<\u002Fbutton><\u002Fsc-if>\n  <\u002Fheader>\n  <div id=\"journal\" style=\"display: flex; flex-direction: column; border-top: 1px solid #333336; scroll-margin-top: 90px;\">\n    <sc-for list=\"{{listed}}\" as=\"e\" hint-placeholder-count=\"8\">\n      <div style=\"{{e.wrap}}\">\n        <button class=\"row\" sc-camel-on-click=\"{{e.pick}}\" aria-expanded=\"{{e.exp}}\" style=\"{{e.style}}\">\n          <span style=\"width: 92px; flex: none; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: #a3a09a;\">{{e.dateShort}}<\u002Fspan>\n          <span style=\"{{e.dot}}\"><\u002Fspan>\n          <span style=\"flex: 1 1 240px; min-width: 0; text-align: left; font-family: 'GC Sanomat', Georgia, serif; font-size: 18px; line-height: 1.3;\">{{e.nom}}<\u002Fspan>\n          <span style=\"flex: 0 0 auto; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: #dd203c;\">{{e.pays}}<\u002Fspan>\n          <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 14 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" aria-hidden=\"true\" style=\"{{e.chev}}\"><path d=\"M3 5l4 4 4-4\"><\u002Fpath><\u002Fsvg>\n        <\u002Fbutton>\n        <sc-if value=\"{{e.open}}\" hint-placeholder-val=\"{{false}}\">\n          <div style=\"display: flex; flex-wrap: wrap; gap: 24px 40px; padding: 6px 8px 28px clamp(8px, 9vw, 126px);\">\n            <div style=\"flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; border-top: 1px solid #dd203c;\">\n              <sc-for list=\"{{e.rows}}\" as=\"rw\" hint-placeholder-count=\"7\">\n                <div style=\"display: flex; gap: 16px; padding: 9px 0; border-bottom: 1px solid #262628; font-size: 14px;\">\n                  <span style=\"width: 170px; flex: none; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #a3a09a; padding-top: 2px;\">{{rw.k}}<\u002Fspan>\n                  <span style=\"flex: 1; min-width: 0; color: #f3f1ec;\">{{rw.v}}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 14px;\">\n              <p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #dedbd6;\">{{e.desc}}<\u002Fp>\n              <div style=\"display: flex; flex-wrap: wrap; gap: 6px 18px;\">\n                <sc-for list=\"{{e.sources}}\" as=\"src\" hint-placeholder-count=\"2\">\n                  <a href=\"{{src.url}}\" target=\"_blank\" rel=\"noopener\" style=\"font-size: 14px;\">↗ {{src.host}}<\u002Fa>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{e.show}}\" style=\"align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; border: 1px solid #dd203c; background: none; padding: 9px 14px; color: #f3f1ec; font-size: 11px; letter-spacing: .16em; text-transform: uppercase;\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><polygon points=\"6,2 18,2 24,12 18,22 6,22 0,12\" fill=\"#dd203c\"><\u002Fpolygon><\u002Fsvg>Voir sur la carte<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <sc-if value=\"{{hasMore}}\" hint-placeholder-val=\"{{false}}\">\n    <button sc-camel-on-click=\"{{toggleAll}}\" style=\"align-self: flex-start; margin-top: 18px; border: 0; border-bottom: 1px solid #dd203c; background: none; padding: 6px 0; color: #f3f1ec; font-weight: 600; font-size: 12px; letter-spacing: .16em; text-transform: uppercase;\">{{moreLabel}}<\u002Fbutton>\n  <\u002Fsc-if>\n\n  <footer style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; padding-top: 28px; margin-top: 40px; border-top: 1px solid #262628; font-size: 13px; color: #a3a09a;\">\n    <span>Carte : Le Grand Continent · Source : Groupe d'études géopolitiques<\u002Fspan>\n    <span style=\"font-family: 'GC Sanomat', Georgia, serif; font-weight: 700; font-size: 16px; color: #f3f1ec;\">Le Grand Continent<\u002Fspan>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:2600}}\">\nconst DATA_URL = 'observatoire-data.json?v=3';\nconst RED = '#dd203c', RED_TXT = '#dd203c';\n// Images et GIF des événements, par identifiant de la base.\n// type : 'photo', 'gif' ou 'satellite'. src : fichier téléversé (/_blob/…) ou adresse sur le serveur du journal.\n// Exemple : 'EVEN2341': { src: '/_blob/…', type: 'gif', alt: 'Le cargo en feu au large de Sulina' },\nconst MEDIA = {\n};\nconst ZMAX = 6;\nconst clampZ = z => {\n  const k = Math.min(ZMAX, Math.max(1, z.k));\n  const h = 50 / k, M = 10; // marge de déplacement autour de l'Europe, en % de la carte\n  return { k, cx: Math.min(100 - h + M, Math.max(h - M, z.cx)), cy: Math.min(100 - h + M, Math.max(h - M, z.cy)) };\n};\n// Écarte les marqueurs qui se chevauchent, en pixels écran, puis revient en %\nfunction spread(nodes, wPx, hPx, r) {\n  const P = nodes.map(n => ({ x: n.x * wPx / 100, y: n.y * hPx / 100, ox: n.x * wPx / 100, oy: n.y * hPx / 100 }));\n  for (let it = 0; it < 40; it++) {\n    for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) {\n      const a = P[i], b = P[j];\n      let dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);\n      if (d < 2 * r) { if (d < .01) { dx = .5 - ((i * 7) % 3) / 3; dy = .3; d = Math.hypot(dx, dy); } const m = (2 * r - d) / 2 / d; a.x -= dx * m; a.y -= dy * m; b.x += dx * m; b.y += dy * m; }\n    }\n    for (const p of P) { p.x += (p.ox - p.x) * .08; p.y += (p.oy - p.y) * .08; }\n  }\n  return P.map(p => [p.x / wPx * 100, p.y / hPx * 100]);\n}\n// Seuils du plus au moins établi : rouge du journal, corail, sable, gris\nconst SEUILS = [\n  { id: 'Confirmé', color: '#dd203c' },\n  { id: 'Attribué', color: '#f58c6c' },\n  { id: 'Suspecté', color: '#e9d3a6' },\n  { id: 'Non déterminé', color: '#77767b' }\n];\nconst COLOR = Object.fromEntries(SEUILS.map(s => [s.id, s.color]));\nconst CATKEY = { 'Aéronef': 'aero', 'Drones': 'drone', 'Sabotage': 'sabo', 'Incendie': 'feu', 'Renseignement': 'rens', 'Ingérence': 'ing' };\nconst START = new Date('2026-09-23T00:00:00').getTime();\nconst DAY = 864e5;\nconst weekOf = d => Math.floor((new Date(d + 'T00:00:00').getTime() - START) / (7 * DAY));\nconst dayIdx = d => Math.round((new Date(d + 'T00:00:00').getTime() - START) / DAY);\nconst T1 = 'Observatoire de la guerre russe';\nconst T2 = 'en Europe';\nconst HEX = 'clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%)';\nconst MOIS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];\nconst MOISL = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];\nconst parse = d => { const [y, m, j] = d.split('-').map(Number); return { y, m, j }; };\nconst fShort = d => { const p = parse(d); return p.j + ' ' + MOIS[p.m - 1] + ' ' + p.y; };\nconst fLong = d => { const p = parse(d); return p.j + ' ' + MOISL[p.m - 1] + ' ' + p.y; };\nconst fDot = d => { const p = parse(d); return String(p.j).padStart(2, '0') + '.' + String(p.m).padStart(2, '0') + '.' + p.y; };\nconst host = u => { try { return new URL(u).hostname.replace(/^www\\./, ''); } catch (e) { return u; } };\nconst paysOf = e => e.pays.split(' / ');\nconst ALL_SEUILS = () => ({ 'Confirmé': true, 'Attribué': true, 'Suspecté': true, 'Non déterminé': true });\nconst ALL_CATS = () => ({ aero: true, drone: true, sabo: true, feu: true, rens: true, ing: true });\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { data: null, seuils: ALL_SEUILS(), cats: ALL_CATS(), passe: true, week: null, country: null, sel: null, showAll: false, open: null, day: null, playing: false, sy: 0, vw: 1440, z: { k: 1, cx: 50, cy: 50 } };\n  }\n  componentDidMount() {\n    fetch(DATA_URL).then(r => r.json()).then(data => this.setState({ data })).catch(() => {});\n    // Défilement : la fenêtre elle-même, ou la page parente quand la carte est en iframe (iframe-resizer)\n    this.onScroll = () => {\n      if (this.raf) return;\n      this.raf = requestAnimationFrame(() => { this.raf = null; if (!this.inFrame) this.setState({ sy: window.scrollY || 0, vw: window.innerWidth }); });\n    };\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    window.addEventListener('resize', this.onScroll, { passive: true });\n    this.onScroll();\n    // Décodage du titre au chargement, façon « Matrix »\n    const GLYPHS = '01<>/\\\\#%&@$▓▒░ABCDEFKXZ';\n    let f = 0;\n    this.decode = setInterval(() => {\n      f++;\n      const k = Math.min(1, f / 24);\n      const scr = s => s.split('').map((ch, i) => (ch === ' ' || i / s.length < k ? ch : GLYPHS[(i * 7 + f * 13) % GLYPHS.length])).join('');\n      if (k >= 1) { clearInterval(this.decode); this.setState({ t1: null, t2: null }); }\n      else this.setState({ t1: scr(T1), t2: scr(T2) });\n    }, 45);\n    // Glitch : salves à intervalles aléatoires, motif tiré au hasard à chaque image\n    const reduce = window.matchMedia && window.matchMedia('(prefers- ...wCounts);\n    const wPeak = wCounts.indexOf(wMax);\n    const dMax = Math.max(...perDay);\n    const dPeak = perDay.indexOf(dMax);\n    const lw = NW - 1, lwN = wCounts[lw] || 0, pwN = wCounts[lw - 1] || 0;\n    const avg = (wCounts.slice(0, Math.max(1, lw)).reduce((a, b) => a + b, 0) / Math.max(1, lw)).toFixed(1).replace('.', ',');\n    const wLab = i => { const d = new Date(START + i * 7 * DAY); return d.getDate() + ' ' + MOIS[d.getMonth()]; };\n    const dLab = i => { const d = new Date(START + i * DAY); return d.getDate() + ' ' + MOIS[d.getMonth()]; };\n    const statStyle = (i) => 'display:flex;flex-direction:column;gap:8px;padding:22px 24px;' + (i ? 'border-left:1px solid #262628' : 'padding-left:0');\n    const chronoStats = [\n      { label: 'Semaine la plus chargée', value: totalT ? String(wMax) : '—', note: totalT ? 'semaine du ' + wLab(wPeak) : 'aucun événement' },\n      { label: 'Jour le plus chargé', value: totalT ? String(dMax) : '—', note: totalT ? dLab(dPeak) + ' 2026' : 'aucun événement' },\n      { label: 'Moyenne hebdomadaire', value: avg, note: 'sur les semaines complètes' },\n      { label: 'Semaine en cours', value: String(lwN), note: (lwN - pwN >= 0 ? '+' : '−') + Math.abs(lwN - pwN) + ' par rapport à la semaine précédente (' + pwN + ')' }\n    ].map((c, i) => ({ ...c, style: statStyle(i) }));\n\n    // Journal\n    const sorted = [...filtered].sort((a, b) => b.date.localeCompare(a.date));\n    const listed = (st.showAll ? sorted : sorted.slice(0, 10)).map(e => {\n      const c = COLOR[e.seuil];\n      const open = st.open === e.id;\n      const on = open;\n      return {\n        nom: e.nom, pays: e.pays, dateShort: fDot(e.date),\n        open, exp: String(open),\n        pick: () => set({ open: open ? null : e.id }),\n        wrap: 'display:flex;flex-direction:column;' + (open ? 'background:rgba(255,255,255,.02);' : ''),\n        chev: 'flex:none;align-self:center;color:#a3a09a;transition:transform .25s;transform:rotate(' + (open ? 180      date: sl, lieu: e.lieu && e.lieu !== e.pays ? e.lieu + ', ' + e.pays : e.pays, nom: e.nom, seuil: e.seuil,\n        badge: 'position:absolute;left:12px;top:12px;padding:5px 9px;border-radius:999px;background:rgba(11,11,12,.75);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#f3f1ec;backdrop-filter:blur(6px)',\n        seuilTag: 'position:absolute;right:12px;top:12px;display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;background:rgba(11,11,12,.75);font-size:11px;color:#f3f1ec;backdrop-filter:blur(6px)',\n        hex: 'width:10px;height:10px;' + HEX + ';background:' + COLOR[e.seuil] + ';opacity:' + (e.passe ? .45 : 1),\n        open: () => {\n          this.setState({ open: e.id, showAll: true });\n          setTimeout(() => { const el = document.getElementById('journal'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 30);\n        }\n      };\n    });\n    const car = () => document.getElementById('carrousel');\n    const carMove = dir => { const el = car(); if (el) el.scrollBy({ left: dir * el.clientWidth * 0.8, behavior: 'smooth' }); };\n    const carScroll = ev => { const el = ev.currentTarget; const max = el.scrollWidth - el.clientWidth; this.setState({ carP: max > 0 ? el.scrollLeft / max : 0 }); };\n    const carP = st.carP || 0;\n    const carBar = 'position:absolute;left:0;top:-1px;height:3px;background:' + RED + ';width:' + Math.max(6, carP * 100).toFixed(1) + '%;transition:width .2s';\n    const mediaCount = withMedia.length ? withMedia.length + ' image' + (withMedia.length > 1 ? 's' : '') : 'Images à ajouter · ' + media.length + ' derniers événements';\n\n    const nPays = new Set(filtered.flatMap(paysOf)).size;\n    let scope = 'depuis le 23 sept. 2026';\n    if (st.week !== null) scope = 'semaine du ' + weeks[st.week].label;\n    if (st.day !== null) scope = 'au ' + dayLabel + '.' + curDate.getFullYear();\n    if (st.country) scope += ' · ' + st.country;\n    const anyFilter = Object.values(st.seuils).some(v => !v) || Object.values(st.cats).some(v => !v) || !st.passe || st.week !== null || !!st.country;\n\n    return {\n      loading: !D,\n      land: D ? D.land : '', east: D ? D.east : '', grat: D ? D.grat : '',\n      vb,\n      lastUpdate: D ? fDot(lastEntry) : '…',\n      total: filtered.length, nPays, scope,\n      nPasse: EV.filter(e => e.passe).length,\n      cats, seuils, ranking, points, sel, weeks, listed, days, dayGrid, weekGrid,\n      chronoStats, cumLine, cumArea, cumVb, cumLabel, cumPoints, glVars, glBars,\n      media, mediaCount, carBar, carScroll, carPrev: () => carMove(-1), carNext: () => carMove(1),\n      t1: st.t1 || T1, t2: st.t2 || T2,\n      heroStyle, barStyle, heroDots, nAll, nPaysAll, nAttr, nWeeks: NW, legend, legendPasse, legendPasseCore,\n      playing: st.playing, notPlaying: !st.playing,\n      playLabel: st.playing ? 'Mettre en pause' : 'Rejouer la veille jour par jour',\n      togglePlay, dayLabel, dayMax: LAST_DAY, dayVal: curDay,\n      toStart: () => goDay(0), toEnd: () => goDay(LAST_DAY),\n      stepBack: () => goDay(curDay - 1), stepFwd: () => goDay(curDay + 1),\n      onSlide: ev => goDay(Number(ev.target.value)),\n      passe: st.passe,\n      togglePasse: () => set({ passe: !st.passe, sel: null }),\n      hasCountry: !!st.country, clearCountry: () => set({ country: null }),\n      hasWeek: st.week !== null, clearWeek: () => set({ week: null }),\n      hasSel: !!s, closeSel: () => set({ sel: null }),\n      mapBoxStyle, zoomHint, panStart, panMove, panEnd, onWheel, onDbl,\n      zoomIn: () => zoomAt(1.6, 50, 50), zoomOut: () => zoomAt(1 / 1.6, 50, 50),\n      zoomReset: () => animTo({ k: 1, cx: 50, cy: 50 }),\n      anyFilter,\n      reset: () => set({ seuils: ALL_SEUILS(), cats: ALL_CATS(), passe: true, week: null, country: null }),\n      hasMore: sorted.length > 10,\n      moreLabel: st.showAll ? 'Réduire le journal' : 'Afficher les ' + sorted.length + ' événements',\n      toggleAll: () => s
