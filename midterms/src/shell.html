<html lang="fr">
<head>

<style>
@font-face{font-family:"GC Sanomat";src:url(fonts/sanomat-regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"GC Sanomat";src:url(fonts/sanomat-bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"GC National";src:url(fonts/national-regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"GC National";src:url(fonts/national-semibold.woff2) format("woff2");font-weight:600;font-display:swap}
body{margin:0;background:#ffffff}
a{color:#c62f3f}a:hover{color:#8e1a27}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;margin:0}
button:focus-visible,a:focus-visible{outline:2px solid #111;outline-offset:2px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.st{position:absolute;inset:0;pointer-events:none;outline:none}
.st svg{width:100%;height:100%;display:block}
.st path{pointer-events:visiblePainted;transition:opacity .15s}
.st:not(:disabled) path{cursor:pointer}
.st:not(:disabled) path:hover{opacity:.78}
.st:focus-visible path{stroke:#111;stroke-width:2.5}
.lbl{position:absolute;transform:translate(-50%,-50%);font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:500;letter-spacing:.04em;pointer-events:none;white-space:nowrap;display:flex;align-items:center;gap:3px}
.co{position:absolute;transform:translateY(-50%);height:20px;padding:0 7px;border-radius:999px;box-sizing:border-box;font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:500;letter-spacing:.04em;display:flex;align-items:center;gap:3px}
.co:hover{opacity:.8}
.cell{position:absolute;box-sizing:border-box;border-radius:2px;transition:opacity .15s;display:flex;align-items:center;justify-content:center}
.cell:hover{opacity:.72}
.cell:focus-visible{outline:2px solid #111;outline-offset:1px;z-index:2}
.hlbl{position:absolute;z-index:5;transform:translate(-50%,-50%);font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;letter-spacing:.02em;pointer-events:none;color:#141414;white-space:nowrap;line-height:1.05;text-align:center;text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 3px #fff}
.pop{position:absolute;z-index:10;width:min(330px,92%);background:#fff;border:1px solid #e4e2de;border-radius:10px;box-shadow:0 8px 28px rgba(20,20,20,.16);padding:12px 12px 10px;display:flex;flex-direction:column;gap:8px;box-sizing:border-box;text-align:left;line-height:1.3}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 36px 70px 56px;align-items:center;gap:6px;padding:6px 8px;font-size:13px}
@media (max-width:600px){.pop{left:4%!important;right:auto!important}}
.thumb{transition:border-color .2s,opacity .2s}.thumb:hover{opacity:1!important}
.row{transition:background .15s}
.row:hover{background:#f6f5f2}
.pill{position:absolute;top:0;height:18px;border-radius:999px;transition:left .6s cubic-bezier(.2,.7,.2,1),width .6s cubic-bezier(.2,.7,.2,1)}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,84,98,.5)}50%{box-shadow:0 0 0 5px rgba(232,84,98,0)}}
.live{animation:pulse 2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.live{animation:none}.pill{transition:none}}
</style>
</head>

// Petit adaptateur : même logique que la maquette du canevas
class DCLogic {
  constructor(props) { this.props = props; this.state = {}; }
  setState(p) { this.state = Object.assign({}, this.state, typeof p === 'function' ? p(this.state) : p); window.__render(); }
}
</script>

<script>
(function () {
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const map = { avant: 'Avant le scrutin', soiree: 'Soirée électorale', final: 'Résultats définitifs' };
  const q = new URLSearchParams(location.search);
  const props = {
    scenario: map[q.get('scenario')] || 'Soirée électorale',
    startChamber: q.get('chambre') === 'chambre' || q.get('chamber') === 'house' ? 'Chambre' : 'Sénat',
    feedUrl: q.get('feed') || '',
    pollSeconds: +q.get('poll') || 60
  };
  // Les fichiers de la carte sont servis à côté de la page
  const BLOBS = { '/_blob/887bfdd2f68fc724fc9240ab6081605d': 'senat-geo.json', '/_blob/ba93beb33d7fdf13da21a8fc3e035859': 'house-grid.json' };
  const realFetch = window.fetch.bind(window);
  window.fetch = (u, o) => realFetch(typeof u === 'string' && BLOBS[u] ? BLOBS[u] : u, o);
  const comp = new Component(props);

  let handlers = {};
  const h = (fn) => { if (!fn) return ''; const id = 'h' + Object.keys(handlers).length; handlers[id] = fn; return id; };
  const dotH = (on, c, size) => on ? '<span style="width:' + (size || '6px') + ';height:' + (size || '6px') + ';border-radius:50%;background:' + c + '"></span>' : '';
  const MONO_S = 'font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#6b6965';
  const H2 = 'margin:0;font-family:\'GC Sanomat\',Georgia,serif;font-weight:700;font-size:26px;letter-spacing:-.01em';
  const H3 = 'margin:0;font-family:\'GC Sanomat\',Georgia,serif;font-weight:700;font-size:30px;line-height:1.02;letter-spacing:-.01em';
  const closeBtn = (fn) => '<button data-h="' + h(fn) + '" aria-label="Fermer le détail" style="flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#6b6965;margin:-10px -12px 0 0"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13"></path></svg></button>';
  const rowBtn = (w, small) => '<button class="row" data-h="' + h(w.pick) + '" aria-label="' + esc(w.aria) + '" style="width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:' + (small ? 6 : 7) + 'px;padding:' + (small ? '10px 8px' : '12px 8px') + ';' + (small ? '' : 'margin:0 -8px;width:calc(100% + 16px);') + 'border-bottom:1px solid #efedea;border-radius:6px;text-align:left;min-height:44px"><span style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><span' + (small ? ' class="mono" style="font-weight:600;font-size:12.5px"' : ' style="font-weight:600;font-size:15px"') + '>' + esc(w.name + w.gainMark) + '</span><span class="mono" style="font-size:11px;color:' + w.statusColor + '">' + esc(w.status) + '</span></span><span aria-hidden="true" style="display:flex;gap:3px;height:' + (small ? 6 : 8) + 'px"><span style="' + w.aStyle + '"></span><span style="flex:1 1 0;border-radius:999px;background:#f0eeea"></span><span style="' + w.bStyle + '"></span></span>' + (small ? '' : '<span class="mono" style="display:flex;justify-content:space-between;font-size:11.5px;color:#5c5a56"><span>' + esc(w.a) + '</span><span>' + esc(w.b) + '</span></span>') + '</button>';

    handlers = {};
    const v = comp.renderVals();
    const tabs = v.tabs.map((t) => '<button class="seg" role="tab" aria-selected="' + t.on + '" data-h="' + h(t.pick) + '" style="' + t.style + '">' + t.label + '</button>').join('');
    const pills = v.pills.map((g) => '<span class="pill" title="' + esc(g.title) + '" style="' + g.style + '"></span>').join('');
    const legend = v.legendParties.map((p) => '<div style="display:grid;grid-template-columns:auto 54px 54px;row-gap:6px;align-items:center"><span></span><span style="text-align:center">En tête</span><span style="text-align:center">Gagné</span><span style="padding-right:8px">' + p.name + '</span><span style="height:12px;border-radius:999px 0 0 999px;background:' + p.tint + '"></span><span style="height:12px;border-radius:0 999px 999px 0;background:' + p.solid + '"></span></div>').join('');
    const slots = v.slots.map((s) => '<div style="flex:1 0 92px;display:flex;flex-direction:column;gap:10px"><span style="' + s.lineStyle + '"></span><span style="display:flex;flex-direction:column;gap:1px"><span class="mono" style="font-size:17px;font-weight:500;color:' + s.timeColor + '">' + s.time + '</span><span class="mono" style="font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#6b6965">' + s.n + '</span></span><span style="display:flex;flex-wrap:wrap;gap:5px">' + s.chips.map((c) => '<button class="co" data-h="' + h(c.pick) + '" aria-label="' + esc(c.aria) + '" style="position:static;transform:none;min-height:26px;' + c.style + '">' + c.t + dotH(c.gain, c.dot) + '</button>').join('') + '</span></div>').join('');

    const thumbs = '<div aria-label="Changer de carte" style="flex:0 0 116px;display:flex;flex-wrap:wrap;gap:14px">'
      + '<button class="thumb" aria-pressed="' + v.thumbS.on + '" data-h="' + h(v.thumbS.pick) + '" style="' + v.thumbS.style + '"><span style="display:block;position:relative;width:100%;aspect-ratio:975/610"><svg aria-hidden="true" viewBox="0 0 975 610" style="position:absolute;inset:0;width:100%;height:100%">' + v.miniS.map((m) => '<path d="' + m.d + '" fill="' + m.fill + '" stroke="#fff" stroke-width="3"></path>').join('') + '</svg></span><span class="mono" style="' + v.thumbS.labelStyle + '">Sénat</span></button>'
      + '<button class="thumb" aria-pressed="' + v.thumbH.on + '" data-h="' + h(v.thumbH.pick) + '" style="' + v.thumbH.style + '"><span style="display:block;position:relative;width:100%;aspect-ratio:' + v.hAspect + '">' + v.miniH.map((m) => '<span style="' + m.style + '"></span>').join('') + '</span><span class="mono" style="' + v.thumbH.labelStyle + '">Chambre</span></button></div>';

    let pop = '';
    const popHead = (kicker, name) => '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div style="display:flex;flex-direction:column;gap:2px;min-width:0"><span class="mono" style="font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#6b6965">' + esc(kicker) + '</span><span style="font-family:\'GC Sanomat\',Georgia,serif;font-weight:700;font-size:18px;line-height:1.1">' + esc(name) + '</span></div><button aria-label="Fermer" data-h="' + h(v.clearSel) + '" style="flex:none;width:32px;height:32px;margin:-6px -6px 0 0;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#6b6965"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13"></path></svg></button></div>';
    if (v.hasSel) {
      const s = v.sel;
      pop = '<div class="pop" role="dialog" aria-label="' + esc(s.name) + '" style="' + v.popStyle + '">' + popHead(s.kicker, s.name)
        + '<div><div class="prow mono" style="padding-top:0;padding-bottom:4px;font-size:10.5px;letter-spacing:.04em;color:#6b6965;border-bottom:1px solid #efedea"><span>Candidat</span><span>Parti</span><span style="text-align:right">Voix</span><span style="text-align:right">%</span></div>'
        + s.cands.map((c) => '<div class="prow" style="border-bottom:1px solid #efedea;' + c.rowStyle + '"><span style="font-weight:600;line-height:1.2">' + esc(c.check + c.n + c.star) + '</span><span style="font-size:12px;opacity:.85">' + c.ps + '</span><span class="mono" style="text-align:right;font-size:12px">' + c.vn + '</span><span class="mono" style="text-align:right;font-weight:600">' + c.pn + '</span></div>').join('') + '</div>'
        + '<div class="mono" style="display:flex;justify-content:space-between;gap:8px;font-size:10.5px;color:#6b6965"><span>' + esc(s.foot) + '</span><span>* Sortant</span></div>'
        + (s.hasBack ? '<button class="mono" data-h="' + h(s.back) + '" style="align-self:flex-start;min-height:28px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#141414;border-bottom:1px solid #141414">Tout l’État →</button>' : '')
        + '</div>';
    } else if (v.hasStateSel) {
      const s = v.stSel;
      pop = '<div class="pop" role="dialog" aria-label="' + esc(s.name) + '" style="' + v.popStyle + '">' + popHead(s.kicker, s.name)
        + '<div class="mono" style="display:flex;gap:14px;font-size:11.5px"><span style="color:#1f6fc4">Dém. ' + s.d + '</span><span style="color:#c62f3f">Rép. ' + s.r + '</span><span style="color:#6b6965">Non tranché ' + s.u + '</span></div>'
        + '<div style="max-height:210px;overflow-y:auto">' + s.rows.map((w) => '<button class="row mono" data-h="' + h(w.pick) + '" aria-label="' + esc(w.aria) + '" style="width:100%;display:flex;justify-content:space-between;gap:8px;padding:7px 4px;border-bottom:1px solid #efedea;font-size:11.5px;text-align:left;box-sizing:border-box"><span style="font-weight:600">' + esc(w.name + w.gainMark) + '</span><span style="color:' + w.statusColor + '">' + esc(w.status) + '</span></button>').join('') + '</div></div>';
    }

    let mapHtml;
    if (v.isSenate) {
      mapHtml = '<div style="flex:1 1 480px;min-width:0;position:relative;aspect-ratio:975/610">' + (v.geoReady

          + v.callouts.map((c) => '<button class="co" data-h="' + h(c.pick) + '" aria-label="' + esc(c.aria) + '" style="' + c.style + '">' + c.t + dotH(c.gain, c.dot) + '</button>').join('') + pop

        + '<svg aria-hidden="true" viewBox="' + v.hView + '" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4"><path d="' + v.hOutline + '" fill="none" stroke="#141414" stroke-width="2.4" vector-effect="non-scaling-stroke" stroke-linecap="square"></path></svg>'
        + v.hLabels.map((l) => '<span class="hlbl" style="' + l.style + '">' + l.t + (l.n ? '<br>' + l.n : '') + '</span>').join('') + pop
        + '</div><span style="font-size:13.5px;color:#5c5a56">Chaque hexagone représente une circonscription, regroupée par État ; sa position dans l’État est indicative.</span></div>';

    const legend2 = (v.isSenate ? '<span style="display:inline-flex;align-items:center;gap:8px"><span style="width:16px;height:16px;box-sizing:border-box;border:1px solid #8c8a85;background:repeating-linear-gradient(-45deg,#b9b6b0 0 1px,transparent 1px 4px)"></span>Pas d’élection</span><span style="display:inline-flex;align-items:center;gap:8px"><span style="width:32px;height:12px;border-radius:999px;background:repeating-linear-gradient(-45deg,#3b8ee6 0 3px,#fff 3px 6px)"></span>Hors scrutin</span>' : '')

    document.getElementById('app').innerHTML =
      '<div style="background:#fff;color:#141414;font-family:\'GC National\',Georgia,serif;font-size:16px;line-height:1.45"><div style="max-width:1200px;margin:0 auto;padding:32px clamp(16px,3vw,40px) 56px;box-sizing:border-box">'
      + '<header style="display:flex;flex-direction:column;gap:14px;padding-bottom:26px"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 24px"><span class="mono" style="font-size:11.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase">États-Unis · Mi-mandat · 3 novembre 2026</span><span class="mono" style="display:inline-flex;align-items:center;gap:9px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#5c5a56;border:1px solid #e4e2de;border-radius:999px;padding:6px 12px"><span class="' + v.liveCls + '" style="width:7px;height:7px;border-radius:50%;background:' + v.liveDot + '"></span>' + esc(v.updatedLabel) + '</span></div>'
      + '<h1 style="margin:0;font-family:\'GC Sanomat\',Georgia,serif;font-weight:700;font-size:clamp(36px,5.2vw,62px);line-height:1;letter-spacing:-.02em;max-width:20ch">' + esc(v.headline) + '</h1><p style="margin:0;max-width:64ch;font-size:18px;line-height:1.5;color:#3a3936">' + esc(v.dek) + '</p>'
      + (v.showMockTag ? '<span class="mono" style="align-self:flex-start;font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#7a5600;background:#fbefcc;border-radius:999px;padding:4px 10px">Maquette · résultats fictifs</span>' : '') + '</header>'
      + '<div role="tablist" aria-label="Choisir l’assemblée" class="mono" style="display:inline-flex;padding:4px;border-radius:999px;background:#f0eeea;margin-bottom:22px">' + tabs + '</div>'

      + '<div style="flex:1;position:relative;align-self:stretch"><div class="mono" style="' + v.markStyle + '"><span style="font-size:11.5px;font-weight:500;letter-spacing:.1em;white-space:nowrap">' + v.markLabel + '</span><svg width="10" height="7" viewBox="0 0 10 7" aria-hidden="true"><path d="M0 0h10L5 7z" fill="#141414"></path></svg></div></div>'

      + (v.isSenate ? '<p style="margin:0;font-size:13.5px;color:#5c5a56">Ohio et Floride : élections partielles pour les sièges laissés par J. D. Vance et Marco Rubio en 2025.</p>' : '') + '</div>'
      + '</section>'
      + '<section aria-label="Calendrier de la nuit électorale" style="padding-top:34px;margin-top:34px;border-top:1px solid #e9e7e3;display:flex;flex-direction:column;gap:18px"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px"><h2 style="' + H2 + '">La nuit électorale, heure par heure</h2><span class="mono" style="' + MONO_S + '">Premiers résultats attendus · heure de Paris, 4 novembre</span></div><div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:6px">' + slots + '</div></section>'
      + '<footer class="mono" style="margin-top:40px;padding-top:14px;border-top:1px solid #e9e7e3;font-size:11px;line-height:1.6;color:#6b6965;display:flex;flex-direction:column;gap:2px"><span>' + esc(v.sourceLine) + '</span><span>' + esc(v.ruleLine) + '</span><span>Horaires : 2026 Poll Hours Report (mis à jour le 27 octobre 2026), convertis en heure de Paris (UTC+1, soit l’heure de l’Est + 6 h après le passage à l’heure d’hiver aux États-Unis le 1er novembre).</span></footer>'
      + '</div></div>';
    const lf = window.__lastFocus;
    if (lf) { const el = document.querySelector('[aria-label="' + CSS.escape(lf) + '"]'); if (el) el.focus({ preventScroll: true }); }
  };
  document.getElementById('app').addEventListener('click', (e) => {
    const b = e.target.closest('[data-h]'); if (!b) return;
    window.__lastFocus = b.getAttribute('aria-label');
    const fn = handlers[b.getAttribute('data-h')]; if (fn) fn();
  });
  window.__render();
  comp.componentDidMount();
})();
</script>
