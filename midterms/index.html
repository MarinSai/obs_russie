    const finalMargin = margin + (rnd() - .5) * 7;
    let eevp;
    if (scenario === 'Avant le scrutin') eevp = 0;
    else if (scenario === 'Résultats définitifs') eevp = rnd() < .2 ? 96 + Math.floor(rnd() * 4) : 100;
    else {
      const elapsed = 25.2 - resET;
      eevp = elapsed < 0 ? 0 : elapsed === 0 ? Math.floor(4 + rnd() * 10) : Math.min(99, Math.floor(18 + elapsed * 22 + rnd() * 14));

  // Sortant, candidats et marge simulée (déterministe) à partir du classement Cook
  houseMeta(house) {
    if (this._hm && this._hmSrc === house) return this._hm;
    const D = this.houseData(), BASE = [22, 9, 5, 0, -5, -9, -22];
    const meta = {};
    for (const c of house.cells) {
      const [holder, cook, cands, favor] = D[c.id];
      const r2 = this.rand('m' + c.id)();
      let m = BASE[cook] + (r2 - .5) * 8;
      if (cands.length < 2) m = 60;
      else if (cands[0][1] === cands[1][1]) m = Math.abs(m) + 3;
      else if (cands[0][1] !== 'D') m = -m;
      meta[c.id] = { holder, cook, cands, favor: favor || '', margin: m, rated: cook > 0 && cook < 6 };
    }
    this._hm = meta; this._hmSrc = house;
    return meta;
  }

  fmtN(v) { return v.toLocaleString('fr-FR').replace(/[  ]/g, ' '); }
  fmtP(v) { return v.toFixed(1).replace('.', ',') + ' %'; }

  renderVals() {
    const scenario = this.props.scenario ?? 'Soirée électorale';
    const chamber = this.state.chamber || (this.props.startChamber === 'Chambre' ? 'H' : 'S');
    const isSenate = chamber === 'S';
    const feed = this.state.feed;
    const HOURS = this.hours(), NAMES = this.names(), RACES = this.races();
    const SOLID = { D: '#3b8ee6', R: '#e85462', I: '#f0b53a', O: '#b9b6b0' };
    const TINT = { D: '#c6e1fb', R: '#f8c9ce', I: '#fbe3a1', O: '#e4e2de' };
    const TEXT = { D: '#1f6fc4', R: '#c62f3f', I: '#8a6200', O: '#6b6965' };
    const PNAME = { D: 'Démocrate', R: 'Républicain', I: 'Indépendant', O: '' };
    const PENDING = '#dcd9d4';
    const closeParis = (et) => { const h = (Math.floor(et) + 6) % 24; return String(h).padStart(2, '0') + ' h ' + (et % 1 ? '30' : '00'); };
    const hatch = (c) => 'repeating-linear-gradient(-45deg, ' + c + ' 0 3px, #ffffff 3px 6px)';
    const leaderOf = (res) => { const s = res.cands.filter((c) => c.p !== 'O').slice().sort((a, b) => b.v - a.v); return s[0] && s[0].v > 0 ? s[0] : null; };
    const fillOf = (r) => r.winner ? SOLID[r.winner] : (leaderOf(r) ? TINT[leaderOf(r).p] : PENDING);
    const txtOf = (r) => r.winner ? '#ffffff' : '#141414';
    const statusText = (r, res) => {
      if (r.status === 'runoff') return 'Second tour';
      if (r.status === 'too_close') return 'Trop serré';
      if (r.status === 'final') return 'Dépouillement terminé';
      if (r.winner) return 'Vainqueur désigné';
      if (r.status === 'counting') return r.eevp + ' % dépouillé';
      return 'Résultats ' + closeParis(res);
    };
    const sel = this.state.sel;
    const pickSel = (v) => () => this.setState({ sel: this.state.sel === v ? null : v });

    // ---------- Sénat ----------
    const sRes = {};
    for (const st in RACES) {
      const f = feed && feed.senate && feed.senate[st];
      const r = RACES[st];
      sRes[st] = f ? this.fromFeed(f) : this.mock(st, r[2], HOURS[st][2], r[3], r[4], scenario);
    }
    const sGain = (st) => !!(sRes[st] && sRes[st].winner && sRes[st].winner !== RACES[st][1]);

    // ---------- Chambre ----------
    const house = this.state.house;
    const hRes = {}, hMeta = house ? this.houseMeta(house) : {};
    if (house) for (const c of house.cells) {
      const f = feed && feed.house && feed.house[c.id];
      const m = hMeta[c.id];
      const cands = m.cands.map((x, i) => i < 2 ? x : [x[0], x[1], x[2], 3]);
      hRes[c.id] = f ? this.fromFeed(f) : this.mock(c.id, m.margin, HOURS[c.st][2], 260 + this.rand('t' + c.id)() * 90, cands, scenario);
    }
    const hGain = (id) => !!(hRes[id] && hRes[id].winner && hMeta[id] && hRes[id].winner !== hMeta[id].holder);

    // ---------- Comptage ----------
    const tally = (resMap) => {
      const won = { D: 0, R: 0, I: 0 }, led = { D: 0, R: 0, I: 0 }; let dV = 0, rV = 0;
      for (const k in resMap) {
        const r = resMap[k];
        for (const c of r.cands) { if (c.p === 'D') dV += c.v; if (c.p === 'R') rV += c.v; }
        if (r.winner) won[r.winner] = (won[r.winner] || 0) + 1;
        else { const l = leaderOf(r); if (l) led[l.p] = (led[l.p] || 0) + 1; }
      }
      return { won, led, dV, rV };
    };
    const T = isSenate ? tally(sRes) : tally(hRes);
    const total = isSenate ? 100 : 435;
    const dBase = isSenate ? 34 : 0, rBase = isSenate ? 31 : 0;
    const dTotal = dBase + T.won.D, rTotal = rBase + T.won.R;
    const undec = total - dTotal - rTotal - T.won.I;
    const majD = isSenate ? 51 : 218, majR = isSenate ? 50 : 218;
    const markAt = isSenate ? 50 : 218;
    const pct = (n) => n / total * 100;
    const pills = [];
    const put = (from, n, bg, title) => { if (n > 0) pills.push({ title, style: 'left: calc(' + pct(from) + '% + 1.5px); width: calc(' + pct(n) + '% - 3px); background: ' + bg + ';' }); };
    let x = 0;
    if (dBase) { put(x, dBase, hatch(SOLID.D), dBase + ' sièges démocrates hors scrutin'); x += dBase; }
    put(x, T.won.D, SOLID.D, T.won.D + ' sièges gagnés par les démocrates'); x += T.won.D;
    put(x, T.led.D, TINT.D, T.led.D + ' courses où le démocrate est en tête'); x += T.led.D;
    put(x, T.won.I, SOLID.I, T.won.I + ' siège(s) indépendant(s)'); x += T.won.I;
    put(x, T.led.I, TINT.I, T.led.I + ' course(s) où un indépendant est en tête'); x += T.led.I;
    let y = total;
    if (rBase) { y -= rBase; put(y, rBase, hatch(SOLID.R), rBase + ' sièges républicains hors scrutin'); }
    y -= T.won.R; put(y, T.won.R, SOLID.R, T.won.R + ' sièges gagnés par les républicains');
    y -= T.led.R; put(y, T.led.R, TINT.R, T.led.R + ' courses où le républicain est en tête');
    if (y - x > 0) put(x, y - x, '#f0eeea', (y - x) + ' courses sans résultat');
    const mPct = pct(markAt);

    // ---------- Carte du Sénat ----------
    const geo = this.state.geo;
    const sFill = (st) => sRes[st] ? fillOf(sRes[st]) : 'url(#noel)';
    const sTxt = (st) => sRes[st] ? txtOf(sRes[st]) : '#141414';
    const SMALL = { NH: 1, MA: 1, RI: 1, NJ: 1, DE: 1 };
    const NUDGE = { MI: [14, 22], FL: [22, 8], LA: [-12, -4], KY: [8, 3], ID: [0, 22], MN: [-6, 4], WV: [-4, 4], VA: [10, 2], NC: [6, 0], SC: [4, 2], ME: [2, 0] };
    const states = [], labels = [], miniS = [];
    if (geo) for (const st in geo.states) {
      const g = geo.states[st], has = !!RACES[st];
      miniS.push({ d: g.d, fill: has ? sFill(st) : '#ecebe8' });
      if (!isSenate) continue;
      states.push({ d: g.d, fill: sFill(st), stroke: has ? '#ffffff' : '#c9c6c0', sw: has ? 1.2 : .6, disabled: !has, pick: has ? pickSel('S:' + st) : null, aria: has ? NAMES[st] + ' : voir les résultats' : NAMES[st] });
      if (has && !SMALL[st]) {
        const nd = NUDGE[st] || [0, 0];
        labels.push({ t: st, gain: sGain(st), dot: sTxt(st), style: 'left: ' + ((g.cx + nd[0]) / 9.75) + '%; top: ' + ((g.cy + nd[1]) / 6.1) + '%; color: ' + sTxt(st) + ';' });
      }
    }
    const CO_Y = { NH: 150, MA: 182, RI: 214, NJ: 262, DE: 300 };
    const callouts = [], coLines = [];
    if (geo && isSenate) for (const st in CO_Y) {
      const g = geo.states[st], yy = CO_Y[st];
      coLines.push({ d: 'M' + g.cx + ',' + g.cy + 'L922,' + yy + 'L930,' + yy });
      callouts.push({ t: st, gain: sGain(st), dot: sTxt(st), aria: NAMES[st] + ' : voir les résultats', pick: pickSel('S:' + st), style: 'left: ' + (930 / 9.75) + '%; top: ' + (yy / 6.1) + '%; background: ' + sFill(st) + '; color: ' + sTxt(st) + ';' + (sel === 'S:' + st ? ' box-shadow: 0 0 0 2px #141414;' : '') });
    }

    // ---------- Carte de la Chambre ----------
    const cells = [], miniH = [], hLabels = [];
    const ordinal = (id) => { const n = id.split('-')[1]; return n === 'AL' ? 'siège unique' : (+n === 1 ? '1re' : +n + 'e') + ' circonscription'; };
    if (house) {
      const W = house.w, H = house.h;
      for (const c of house.cells) {
        const r = hRes[c.id], f = fillOf(r), isSel = sel === 'H:' + c.id;
        const box = house.hex
          ? 'left: ' + (c.x / W * 100) + '%; top: ' + ((c.y + .5 - house.r) / H * 100) + '%; width: ' + (100 / W) + '%; height: ' + (2 * house.r / H * 100) + '%; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);'
          : 'left: ' + (c.x / W * 100) + '%; top: ' + (c.y / H * 100) + '%; width: ' + (100 / W) + '%; height: ' + (100 / H) + '%;';
        miniH.push({ style: 'position: absolute; ' + box + ' transform: scale(.82); background: ' + f + ';' });
        if (isSenate) continue;
        cells.push({
          aria: NAMES[c.st] + ', ' + ordinal(c.id) + ' : ' + statusText(r, HOURS[c.st][2]),
          pick: pickSel('H:' + c.id), gain: hGain(c.id), dot: txtOf(r),
          style: box + ' background: ' + f + ';' + (house.hex ? ' transform: scale(.955);' + (isSel ? ' filter: brightness(.72); z-index: 3;' : '') : ' border: 1.5px solid #ffffff;' + (isSel ? ' box-shadow: inset 0 0 0 2px #141414; z-index: 3;' : ''))
        });
      }
      if (!isSenate) for (const st in house.labels) {
        const [lx, ly, ln] = house.labels[st];
        hLabels.push({ t: st, n: ln ? String(ln) : '', style: 'left: ' + (lx / W * 100) + '%; top: ' + (ly / H * 100) + '%;' });
      }
    }
    const hAspect = house ? house.w + ' / ' + house.h : '46 / 27';
    const hView = house ? '0 0 ' + house.w * house.unit + ' ' + house.h * house.unit : '0 0 460 270';

    // ---------- Panneau ----------
    const EXTRA = {
      GA: 'Sans majorité absolue, second tour le 1er décembre.',
      AK: 'Vote préférentiel : le décompte final peut prendre plusieurs jours.',
      ME: 'Vote préférentiel en cas d’absence de majorité absolue.',
      NE: 'Pas de candidat démocrate : Dan Osborn, indépendant, est soutenu par les démocrates.',
      ID: 'Pas de candidat démocrate.', SD: 'Pas de candidat démocrate.',
      MT: 'Seth Bodnar, indépendant, est soutenu par Jon Tester.',
      SC: 'Darline Graham a été nommée en juillet après la mort de Lindsey Graham.',
      OK: 'Alan Armstrong, nommé en mars après le départ de Markwayne Mullin, ne se représente pas.'
    };
    const hoursRows = (st) => {
      const h = HOURS[st];
      return [
        { k: h[0] === h[1] ? 'Fermeture des bureaux' : 'Premiers bureaux fermés', v: closeParis(h[0]) },
        ...(h[0] === h[1] ? [] : [{ k: 'Derniers bureaux fermés', v: closeParis(h[1]) }]),
        { k: 'Premiers résultats', v: closeParis(h[2]) }
      ];
    };
    const panelFor = (r, holder, st, title, kicker, extra, back) => {
      const tot = r.cands.reduce((s, c) => s + c.v, 0);
      const sorted = r.eevp > 0 ? r.cands.slice().sort((a, b) => (a.p === 'O') - (b.p === 'O') || b.v - a.v) : r.cands;
      const winC = r.winner ? sorted.find((c) => c.p === r.winner) : null;
      const gain = r.winner && r.winner !== holder, pending = r.status === 'pending';
      return {
        name: title, kicker,
        status: statusText(r, HOURS[st][2]) + (gain ? ' · gain ' + (r.winner === 'D' ? 'démocrate' : r.winner === 'R' ? 'républicain' : 'indépendant') : ''),
        badgeStyle: r.winner ? 'background: ' + SOLID[r.winner] + '; color: #ffffff;' : (pending ? 'background: #f0eeea; color: #3a3936;' : 'background: #141414; color: #ffffff;'),
        cands: sorted.map((c) => {
          const share = pending || !tot ? 0 : c.v / tot * 100;
          const isW = winC && c === winC;
          return {
            n: c.n, star: c.inc ? '*' : '', check: isW ? '✓ ' : '', p: PNAME[c.p] || 'Divers',
            v: pending ? '—' : this.fmtN(c.v) + ' voix', pct: pending ? '—' : this.fmtP(share),
            text: TEXT[c.p] || '#6b6965',
            ps: ({ D: 'Dém.', R: 'Rép.', I: 'Ind.' })[c.p] || 'Div.',
            vn: pending ? '—' : this.fmtN(c.v), pn: pending ? '—' : this.fmtP(share),
            rowStyle: isW ? 'background: ' + SOLID[c.p] + '; color: #ffffff;' : 'box-shadow: inset 3px 0 0 ' + (SOLID[c.p] || '#8c8a85') + ';',
            barStyle: 'width: ' + share + '%; background: ' + (isW || !r.winner ? SOLID[c.p] : TINT[c.p]) + ';'
          };
        }),
        eevpLabel: pending ? 'Aucun résultat pour l’instant' : '≈ ' + r.eevp + ' % des votes attendus dépouillés',
        eevpW: r.eevp + '%',
        foot: pending ? statusText(r, HOURS[st][2]) : '≈ ' + r.eevp + ' % dépouillé' + (r.winner ? ' · désigné par AP' : ''),
        note: (pending ? '' : (r.winner ? 'Vainqueur désigné par l’Associated Press ; les chiffres évoluent jusqu’à la certification. ' : 'Résultats partiels, course non tranchée. ')) + (extra || ''),
        hours: hoursRows(st),
        hasBack: !!back, back
      };
    };
    let selV = null, stSel = null;
    if (sel && isSenate && sel.startsWith('S:')) {
      const st = sel.slice(2), race = RACES[st];
      const kind = race[0] === 'Partielle' ? 'Élection partielle' : race[0] === 'Siège ouvert' ? 'Siège ouvert' : race[0] === 'Sortant battu' ? 'Sortant battu à la primaire' : 'Élection ordinaire';
      selV = panelFor(sRes[st], race[1], st, NAMES[st], kind + ' · siège ' + (race[1] === 'D' ? 'démocrate' : 'républicain'), EXTRA[st], null);
    } else if (sel && !isSenate && sel.startsWith('H:') && hRes[sel.slice(2)]) {
      const id = sel.slice(2), st = id.split('-')[0], m = hMeta[id];
      selV = panelFor(hRes[id], m.holder, st, NAMES[st] + ', ' + ordinal(id), 'Siège ' + (m.holder === 'D' ? 'démocrate' : 'républicain') + ' sortant · ' + ['Démocrate sûr (Cook)', 'Plutôt démocrate (Cook)', 'Plutôt démocrate (Cook)', 'Indécis (Cook)', 'Plutôt républicain (Cook)', 'Plutôt républicain (Cook)', 'Républicain sûr (Cook)'][m.cook] + (m.favor ? ' · redécoupée en faveur des ' + (m.favor === 'R' ? 'républicains' : 'démocrates') : ''), 'Candidats : Bloomberg (données AP) ; résultats fictifs.', () => this.setState({ sel: 'HS:' + st }));
    } else if (sel && !isSenate && sel.startsWith('HS:') && house) {
      const st = sel.slice(3);
      const ids = house.cells.filter((c) => c.st === st).map((c) => c.id).sort();
      let d = 0, r = 0, u = 0;
      const rows = ids.map((id) => {
        const res = hRes[id];
        if (res.winner === 'D') d++; else if (res.winner === 'R') r++; else u++;
        const tot = res.cands.reduce((s, c) => s + c.v, 0) || 1;
        const pa = res.eevp ? res.cands[0].v / tot * 100 : 0, pb = res.eevp ? res.cands[1].v / tot * 100 : 0;
        const barS = (p, party) => 'flex: 0 0 calc(' + p + '% - 3px); border-radius: 999px; background: ' + (res.winner ? (res.winner === party ? SOLID[party] : TINT[party]) : SOLID[party]) + ';' + (p ? '' : ' display: none;');
        return { name: id.replace('-AL', ' (unique)'), gainMark: hGain(id) ? ' ●' : '', pick: pickSel('H:' + id), aria: NAMES[st] + ', ' + ordinal(id), status: statusText(res, HOURS[st][2]), statusColor: res.winner ? TEXT[res.winner] : '#6b6965', aStyle: barS(pa, 'D'), bStyle: barS(pb, 'R') };
      });
      stSel = { name: NAMES[st], kicker: 'Chambre · ' + ids.length + ' circonscription' + (ids.length > 1 ? 's' : ''), d, r, u, rows };
    }

    let ax = 50, ay = 30;
    if (sel && sel.startsWith('S:')) {
      const st = sel.slice(2);
      if (CO_Y[st]) { ax = 930 / 9.75; ay = CO_Y[st] / 6.1; } else if (geo && geo.states[st]) { ax = geo.states[st].cx / 9.75; ay = geo.states[st].cy / 6.1; }
    } else if (sel && house && sel.startsWith('H:')) {
      const c = house.cells.find((q) => q.id === sel.slice(2));
      if (c) { ax = (c.x + .5) / house.w * 100; ay = (c.y + .5) / house.h * 100; }
    } else if (sel && house && sel.startsWith('HS:') && house.labels[sel.slice(3)]) {
      const l = house.labels[sel.slice(3)]; ax = l[0] / house.w * 100; ay = l[1] / house.h * 100;
    }
    const popStyle = (ax > 55 ? 'right: calc(' + (100 - ax) + '% + 12px);' : 'left: calc(' + ax + '% + 12px);') + (ay > 50 ? ' bottom: calc(' + (100 - ay) + '% - 18px);' : ' top: calc(' + ay + '% - 18px);');

    // ---------- Courses à suivre ----------
    const watchRow = (name, r, a, b, gain, pick, resET) => {
      const tot = r.cands.reduce((s, c) => s + c.v, 0) || 1;
      const pa = r.eevp ? a.v / tot * 100 : 0, pb = r.eevp ? b.v / tot * 100 : 0;
      const last = (n) => n.startsWith('Candidat') ? (n.endsWith('démocrate') ? 'Dém.' : 'Rép.') : n.split(' ').slice(-1)[0];
      const barS = (c, p) => 'flex: 0 0 calc(' + p + '% - 3px); border-radius: 999px; background: ' + (r.winner ? (r.winner === c.p ? SOLID[c.p] : TINT[c.p]) : SOLID[c.p]) + ';' + (p ? '' : ' display: none;');
      return {
        name, gainMark: gain ? ' ●' : '', pick, aria: name + ', ' + statusText(r, resET),
        status: statusText(r, resET), statusColor: r.winner ? TEXT[r.winner] : '#6b6965',
        aStyle: barS(a, pa), bStyle: barS(b, pb),
        a: last(a.n) + (a.inc ? '*' : '') + (r.eevp ? '  ' + this.fmtP(pa) : ''),
        b: (r.eevp ? this.fmtP(pb) + '  ' : '') + last(b.n) + (b.inc ? '*' : '')
      };
    };
    const watch = isSenate
      ? ['OH', 'TX', 'IA', 'KS', 'ME', 'MI', 'AK', 'MN', 'NH', 'NC', 'SC'].map((st) => watchRow(NAMES[st], sRes[st], sRes[st].cands[0], sRes[st].cands[1], sGain(st), pickSel('S:' + st), HOURS[st][2]))
      : (house ? ['IA-02', 'MI-04', 'MI-07', 'MI-10', 'MT-01', 'OH-07', 'OH-09', 'PA-08', 'AZ-01', 'AZ-06', 'CO-08', 'PA-07'].filter((id) => hRes[id]).map((id) => { const st = id.split('-')[0], r = hRes[id]; return watchRow(NAMES[st] + ' · ' + id, r, r.cands[0], r.cands[1], hGain(id), pickSel('H:' + id), HOURS[st][2]); }) : []);

    // ---------- Calendrier ----------
    const NOW_ET = scenario === 'Avant le scrutin' ? 0 : scenario === 'Soirée électorale' ? 25.2 : 99;
    const bySlot = {};
    const slotStates = isSenate ? Object.keys(RACES) : Object.keys(HOURS);
    for (const st of slotStates) { const t = HOURS[st][2]; (bySlot[t] = bySlot[t] || []).push(st); }
    const hByState = {};
    if (house) for (const c of house.cells) (hByState[c.st] = hByState[c.st] || []).push(c.id);
    const slots = Object.keys(bySlot).map(Number).sort((a, b) => a - b).map((t) => {
      const past = NOW_ET >= t;
      const sts = bySlot[t].sort();
      const nSeats = isSenate ? sts.length : sts.reduce((s, st) => s + (hByState[st] || []).length, 0);
      return {
        time: closeParis(t),
        timeColor: past ? '#141414' : '#8c8a85',
        lineStyle: 'height: 2px; border-radius: 999px; background: ' + (past ? '#141414' : '#e4e2de') + ';',
        n: isSenate ? nSeats + ' course' + (nSeats > 1 ? 's' : '') : nSeats + ' siège' + (nSeats > 1 ? 's' : ''),
        chips: sts.map((st) => {
          if (isSenate) {
            const f = sFill(st), pend = f === PENDING;
            return { t: st, gain: sGain(st), dot: sTxt(st), pick: pickSel('S:' + st), aria: NAMES[st] + ', ' + statusText(sRes[st], HOURS[st][2]),
              style: 'background: ' + (pend ? '#ffffff' : f) + '; color: ' + sTxt(st) + '; box-shadow: inset 0 0 0 1px ' + (pend ? '#cfccc6' : 'transparent') + (sel === 'S:' + st ? ', 0 0 0 2px #141414' : '') + ';' };
          }
          const ids = hByState[st] || [];
          const dW = ids.filter((id) => hRes[id] && hRes[id].winner === 'D').length, rW = ids.filter((id) => hRes[id] && hRes[id].winner === 'R').length;
          const done = ids.length && dW + rW === ids.length;
          const bg = done ? 'linear-gradient(90deg, ' + SOLID.D + ' ' + (dW / ids.length * 100) + '%, ' + SOLID.R + ' 0)' : (dW + rW ? 'linear-gradient(90deg, ' + TINT.D + ' ' + (dW / ids.length * 100) + '%, #ffffff 0, #ffffff ' + (100 - rW / ids.length * 100) + '%, ' + TINT.R + ' 0)' : '#ffffff');
          return { t: st + ' ' + ids.length, gain: false, dot: '#141414', pick: pickSel('HS:' + st), aria: NAMES[st] + ', ' + ids.length + ' circonscriptions',
            style: 'background: ' + bg + '; color: ' + (done ? '#ffffff' : '#141414') + '; box-shadow: inset 0 0 0 1px ' + (done ? 'transparent' : '#cfccc6') + (sel === 'HS:' + st ? ', 0 0 0 2px #141414' : '') + ';' };
        })
      };
    });

    // ---------- Textes ----------
    const before = scenario === 'Avant le scrutin';
    const dCtrl = dTotal >= majD && !before, rCtrl = rTotal >= majR && !dCtrl && !before;
    const live = !!feed || scenario === 'Soirée électorale';
    const updated = feed && feed.updated ? 'Mis à jour ' + feed.updated : (this.state.feedErr ? 'Flux indisponible, nouvel essai…' : before ? 'Premiers résultats le 4 nov. à minuit' : scenario === 'Soirée électorale' ? 'Mis à jour à 07 h 12, heure de Paris' : 'Mis à jour le 5 nov. à 18 h 00');
    const tabStyle = (on) => 'min-height: 40px; padding: 0 18px; border-radius: 999px; font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; ' + (on ? 'background: #141414; color: #ffffff;' : 'color: #3a3936;');
    const thumb = (on, key) => ({
      on, pick: () => this.setState({ chamber: key, sel: null }),
      style: 'width: 116px; display: flex; flex-direction: column; gap: 8px; padding: 8px; border-radius: 10px; box-sizing: border-box; border: 1.5px solid ' + (on ? '#141414' : '#e9e7e3') + '; opacity: ' + (on ? 1 : .62) + ';',
      labelStyle: 'font-size: 11px; letter-spacing: .1em; text-transform: uppercase; text-align: center; font-weight: ' + (on ? 600 : 400) + '; color: #141414;'
    });

    return {
      tabs: [
        { label: 'Sénat', on: isSenate, pick: () => this.setState({ chamber: 'S', sel: null }), style: tabStyle(isSenate) },
        { label: 'Chambre des représentants', on: !isSenate, pick: () => this.setState({ chamber: 'H', sel: null }), style: tabStyle(!isSenate) }
      ],
      thumbS: thumb(isSenate, 'S'), thumbH: thumb(!isSenate, 'H'),
      isSenate, isHouse: !isSenate,
      headline: isSenate
        ? (dCtrl ? 'Les démocrates reprennent le Sénat' : rCtrl ? 'Les républicains gardent le Sénat' : 'Sénat : les résultats en direct')
        : (dCtrl ? 'Les démocrates prennent la Chambre' : rCtrl ? 'Les républicains gardent la Chambre' : 'Chambre : les résultats en direct'),
      dek: isSenate
        ? (before ? '35 sièges sur 100 sont en jeu le 3 novembre : 33 élections ordinaires et deux partielles, en Ohio et en Floride. Les républicains détiennent 53 sièges ; les démocrates doivent en gagner quatre de plus pour prendre la majorité.' : '35 sièges sur 100 étaient en jeu. Les républicains détenaient 53 sièges avant le scrutin ; les démocrates devaient en gagner quatre de plus pour prendre la majorité.')
        : (before ? 'Les 435 sièges de la Chambre sont renouvelés le 3 novembre. Au 2 septembre, les républicains en détenaient 218, les démocrates 214 et un indépendant 1, avec deux sièges vacants. La majorité est à 218.' : 'Les 435 sièges de la Chambre étaient renouvelés. Au 2 septembre, les républicains en détenaient 218, les démocrates 214 et un indépendant 1, avec deux sièges vacants. La majorité est à 218.'),
      showMockTag: !feed,
      liveCls: live ? 'live' : '', liveDot: live ? '#e85462' : '#b9b6b0', updatedLabel: updated,
      dTotal, rTotal,
      dCheck: dCtrl ? '✓' : '', rCheck: rCtrl ? '✓' : '',
      dVotes: T.dV ? this.fmtN(T.dV) + ' voix' : '—', rVotes: T.rV ? this.fmtN(T.rV) + ' voix' : '—',
      pendingLabel: before ? (isSenate ? '35 sièges en jeu' : '435 sièges en jeu') : (undec > 0 ? undec + ' sièges non attribués' : ''),
      markLabel: markAt + ' SIÈGES',
      markStyle: 'position: absolute; left: ' + mPct + '%; bottom: 2px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 2px;',
      markLine: 'position: absolute; left: ' + mPct + '%; top: -5px; bottom: -5px; width: 2px; margin-left: -1px; background: #141414;',
      pills, barAria: 'Démocrates ' + dTotal + ' sièges, républicains ' + rTotal + ' sièges, ' + undec + ' non attribués',
      legendParties: [
        { name: 'Dém.', tint: TINT.D, solid: SOLID.D },
        { name: 'Rép.', tint: TINT.R, solid: SOLID.R },
