name: Mise à jour des données de l'Observatoire

on:
  schedule:
    - cron: "17 * * * *"      # toutes les heures, à la minute 17
  workflow_dispatch:           # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Générer observatoire-data.json depuis la feuille
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
          # Feuille « Observatoire – Médias », publiée en CSV (contenu public : il est affiché sur le site)
          MEDIA_CSV_URL: ${{ secrets.MEDIA_CSV_URL || 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQpvAdYHBBlvQ-1mu4XNg2dkCDGm1LK5bEHoUFw8bqvPZx8SP4eB4by_0ZiD88-1erV-Sz8e4eCIh83/pub?gid=1363703715&single=true&output=csv' }}
        run: python scripts/build_data.py --out observatoire-data.json --summary "$RUNNER_TEMP/summary.txt"

      - name: Traduire en italien et en espagnol (DeepL)
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: |
          python scripts/translate_data.py | tee "$RUNNER_TEMP/tr.txt"
          { echo; cat "$RUNNER_TEMP/tr.txt"; } >> "$RUNNER_TEMP/summary.txt" || true

      - name: Publier si les fichiers ont changé
        run: |
          git add -N observatoire-data-it.json observatoire-data-es.json translations 2>/dev/null || true
          if git diff --quiet -- observatoire-data.json observatoire-data-it.json observatoire-data-es.json translations; then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name "observatoire-bot"
          git config user.email "observatoire-bot@users.noreply.github.com"
          git add observatoire-data.json observatoire-data-it.json observatoire-data-es.json translations
          [ -s "$RUNNER_TEMP/summary.txt" ] || echo "Données de l'Observatoire : traductions" > "$RUNNER_TEMP/summary.txt"
          git commit -F "$RUNNER_TEMP/summary.txt"
          git pull --rebase origin main && git push || (sleep 5 && git pull --rebase origin main && git push)
