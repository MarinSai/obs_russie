name: Versions italienne et espagnole de la page

on:
  push:
    branches: [main]
    paths:
      - observatoire.html
      - scripts/i18n.py
      - scripts/build_lang.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-lang
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Échoue (et prévient par e-mail) si un texte français de la page n'a pas de traduction dans scripts/i18n.py
      - name: Générer observatoire_russie_IT.html et observatoire_russie_ES.html
        run: python scripts/build_lang.py
      - name: Publier si les fichiers ont changé
        run: |
          if git diff --quiet -- observatoire_russie_IT.html observatoire_russie_ES.html; then echo "Aucun changement."; exit 0; fi
          git config user.name "observatoire-bot"
          git config user.email "observatoire-bot@users.noreply.github.com"
          git add observatoire_russie_IT.html observatoire_russie_ES.html
          git commit -m "Versions IT/ES régénérées depuis la page française"
          git pull --rebase origin main && git push || (sleep 5 && git pull --rebase origin main && git push)
